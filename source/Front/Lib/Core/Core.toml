[project]
name            = "Core"          # 或实际项目名
desc            = "Sample project"
mainVersion     = 1
subVersion      = 0
buildVersion    = 0
buildSubVersion = 0

[source]
root      = "samples/SLang/source"
entryFile = "Main.sl"

[compile]
optimize                     = false
target                       = "x64"
debug                        = true
isUseForceSemiColonInLineEnd = true
isForceUseClassKey           = false
isSupportDoublePlus          = false


[[compileFiles.files]]
path     = "Array.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0

[[compileFiles.files]]
path     = "MethodCall/NativeBridge.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0

#[[compileFiles.files]]
#path     = "Test/ObjectTest.sl"
#path     = "Test/NumberTest.sl"
#path     = "Test/StringTest.sl"
#path     = "Test/TypeTest.sl"
#group    = "core"
#tag      = "ir"
#ignore   = false
#priority = 0

[[importFiles.Module]]
path = "./Std.dll"
uuid = "321323-123123-123123-123123"
name = "Std"

[[importFiles.Module]]
path = "./test/Math.dll"
uuid = "321323-123123-123123-123123"
name = "Math"





[compileFilter]
isAllGroup = true
isAllTag   = true

[global]
imports = [
  "Std.Console",
  "Std.IO.File",
]

[global.replace]
DEBUG = "true"

[[references]]
path = "lib/std"

[[references]]
path = "lib/core"


[[struct.tree]]
namespace = "Core"

[[struct.tree]]
namespace = "Std"

[[struct.tree]]
class = "Std.Console"
