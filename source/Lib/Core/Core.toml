[project]
name            = "Core"          # 或实际项目名
desc            = "Sample project"
mainVersion     = 1
subVersion      = 0
buildVersion    = 0
buildSubVersion = 0

[source]
root      = "samples/SLang/source"
entryFile = "Main.sl"

[compile]
optimize                     = false
target                       = "x64"
debug                        = true
isUseForceSemiColonInLineEnd = true
isForceUseClassKey           = false
isSupportDoublePlus          = false

[compileFiles]

[[compileFiles.files]]
path     = "Object.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0

[[compileFiles.files]]
path     = "Boolean.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0

[[compileFiles.files]]
path     = "Num.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0

[[compileFiles.files]]
path     = "Byte.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0

[[compileFiles.files]]
path     = "SByte.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0

[[compileFiles.files]]
path     = "Int32.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0


[[compileFiles.files]]
path     = "Float32.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0

[[compileFiles.files]]
path     = "Float64.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0

[[compileFiles.files]]
path     = "String.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0

[[compileFiles.files]]
path     = "IteratorInterface.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0

[[compileFiles.files]]
path     = "Array.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0

[[compileFiles.files]]
#path     = "Test/ObjectTest.sl"
path     = "Test/NumberTest.sl"
#path     = "Test/StringTest.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0



[compileFilter]
isAllGroup = true
isAllTag   = true

[global]
imports = [
  "Std.Console",
  "Std.IO.File",
]

[global.replace]
DEBUG = "true"

[[references]]
path = "lib/std"

[[references]]
path = "lib/core"


[[struct.tree]]
namespace = "Core"

[[struct.tree]]
namespace = "Std"

[[struct.tree]]
class = "Std.Console"
