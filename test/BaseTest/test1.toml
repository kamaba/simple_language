[project]
name            = "BaseTest"          # 或实际项目名
desc            = "Sample project"
mainVersion     = 1
subVersion      = 0
buildVersion    = 0
buildSubVersion = 0

[source]
root      = "samples/SLang/source"
entryFile = "Main.sl"

[compile]
optimize                     = false
target                       = "x64"
debug                        = true
isUseForceSemiColonInLineEnd = true
isForceUseClassKey           = false
isSupportDoublePlus          = false

[compileFiles]

[[compileFiles.files]]
path     = "12_ArrayTest.sl"
group    = "core"
tag      = "ir"
ignore   = false
priority = 0


[compileFilter]
isAllGroup = true
isAllTag   = true

[global]
imports = [
  "Std.Console",
  "Std.IO.File",
]

[global.replace]
DEBUG = "true"

[[references]]
path = "lib/std"

[[references]]
path = "lib/core"

[[struct.tree]]
namespace = "Std"

[[struct.tree]]
class = "Std.Console"
